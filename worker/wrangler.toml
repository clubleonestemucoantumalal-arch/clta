name = "clta-publicar"
main = "publicar.js"
compatibility_date = "2026-10-01"

# Solo responde en clta.cl/api/*. Esa ruta debe estar protegida por Cloudflare Access.
routes = [
  { pattern = "clta.cl/api/*", zone_name = "clta.cl" },
  # Rutas públicas (visitas y mensajes del formulario). NO deben estar dentro de Cloudflare Access.
  { pattern = "clta.cl/p/*", zone_name = "clta.cl" }
]

# Base de datos de visitas y mensajes. Crear con:  npx wrangler d1 create clta-datos
# y pegar aquí el database_id que entrega. Ver docs/VISITAS-Y-MENSAJES.md
[[d1_databases]]
binding = "DB"
database_name = "clta-datos"
database_id = "28c36370-1619-4f88-90a4-11e24bb51865"

[vars]
GH_USUARIO = "clubleonestemucoantumalal-arch"
GH_REPO    = "clta"
GH_RAMA    = "main"
# Datos de la aplicación de Cloudflare Access que protege el panel:
ACCESS_TEAM = "twilight-wave-97b6"   # lo que va antes de .cloudflareaccess.com
ACCESS_AUD  = "843e15c9744e0817b5ffccd6be5153836edc640dbda71d7605554610edc8edba"   # "Application Audience (AUD) Tag" de la aplicación Panel del club
# Opcional: lista de correos que pueden publicar, separados por coma. Vacío = todos los autorizados en Access.
EDITORES = ""
# Envío de correos desde el panel (servicio Resend). El secreto RESEND_API_KEY se guarda con:  npx wrangler secret put RESEND_API_KEY
MAIL_DE = "Club de Leones Temuco Antumalal <info@clta.cl>"
MAIL_RESPONDER = "info@clta.cl"

# El secreto GITHUB_TOKEN NO va aquí. Se guarda con:  npx wrangler secret put GITHUB_TOKEN
