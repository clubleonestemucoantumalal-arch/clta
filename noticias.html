<!DOCTYPE html>

<style>
  :root { --noche: #030A1F; --azul: #001F5C; --oro: #FFCD00; --papel: #F5EFE0; --linea: rgba(255,255,255,.16); --txt: rgba(255,255,255,.86); --f-tit: 'Instrument Serif', Georgia, serif; --f-txt: 'Instrument Sans', system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body { font: 400 1.1rem/1.75 var(--f-txt); color: var(--txt); background: var(--noche); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .prog { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--oro); z-index: 50; }
  .wrap { width: min(100% - 32px, 1120px); margin-inline: auto; }
  .estrecho { width: min(100% - 32px, 720px); margin-inline: auto; }

  /* barra */
  .barra { position: absolute; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem clamp(16px, 4vw, 40px); }
  .barra__marca { display: flex; align-items: center; gap: .8rem; text-decoration: none; color: #fff; font-weight: 600; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
  .barra__marca img { width: 48px; height: 48px; }
  .pill { display: inline-flex; align-items: center; gap: .5rem; padding: .6rem 1.1rem; border-radius: 99px; background: rgba(3,10,31,.55); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.25); color: #fff; font-weight: 600; font-size: .92rem; text-decoration: none; }
  .pill:hover { border-color: var(--oro); color: var(--oro); }

  /* portada */
  .hero { position: relative; min-height: min(86vh, 760px); display: grid; align-items: end; overflow: hidden; background: #0B2260; }
  .hero__img { position: absolute; inset: 0; }
  .hero__img img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; transform: scale(1.04); animation: zoom 14s ease-out forwards; }
  @keyframes zoom { to { transform: scale(1.12); } }
  .hero__img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(3,10,31,.55) 0%, rgba(3,10,31,.05) 30%, rgba(3,10,31,.78) 72%, var(--noche) 100%); }
  .hero__txt { position: relative; z-index: 2; padding: clamp(6rem, 18vh, 10rem) 0 clamp(2rem, 6vh, 3.4rem); }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.2rem; }
  .chip { font: 700 .74rem/1 var(--f-txt); letter-spacing: .12em; text-transform: uppercase; color: var(--noche); background: var(--oro); border-radius: 99px; padding: .5rem .9rem; }
  .chip--l { background: rgba(3,10,31,.55); color: #fff; border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(8px); }
  h1 { font: 400 clamp(2.5rem, 7vw, 5.2rem)/.98 var(--f-tit); color: #fff; letter-spacing: -.02em; max-width: 18ch; text-shadow: 0 4px 30px rgba(0,0,0,.45); }
  .hero__bajada { margin-top: 1.2rem; max-width: 40ch; font-size: clamp(1.1rem, 2.2vw, 1.4rem); line-height: 1.45; color: #fff; text-shadow: 0 2px 16px rgba(0,0,0,.5); }

  /* cifras */
  .cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--linea); border: 1px solid var(--linea); border-radius: 1.4rem; overflow: hidden; margin-top: -2rem; position: relative; z-index: 3; box-shadow: 0 30px 60px -30px rgba(0,0,0,.8); }
  .cifra { background: linear-gradient(180deg, #0B2260, #06153F); padding: 1.3rem 1.5rem; }
  .cifra b { display: block; font: 400 clamp(1.8rem, 4vw, 2.6rem)/1 var(--f-tit); color: var(--oro); margin-bottom: .35rem; }
  .cifra span { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.7); }

  /* relato */
  .relato { padding: clamp(2.6rem, 8vh, 4.5rem) 0 clamp(1.6rem, 4vh, 2.6rem); }
  .relato p { margin-bottom: 1.4rem; }
  .relato p:first-child::first-letter { float: left; font: 400 4.6rem/.8 var(--f-tit); color: var(--oro); padding: .35rem .6rem 0 0; }
  .relato p:first-child { color: #fff; font-size: 1.2rem; }
  .cita { margin: clamp(2rem, 5vh, 3rem) 0; padding: .4rem 0 .4rem 1.6rem; border-left: 3px solid var(--oro); font: italic 400 clamp(1.6rem, 3.6vw, 2.2rem)/1.2 var(--f-tit); color: #fff; }

  /* galería */
  .galeria { padding: clamp(1.4rem, 4vh, 2.4rem) 0; }
  .galeria h2, .mas h2 { font: 400 clamp(1.8rem, 3.6vw, 2.5rem)/1 var(--f-tit); color: #fff; margin-bottom: 1.2rem; }
  .galeria__rej { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
  .foto { position: relative; border: 0; padding: 0; border-radius: 1.2rem; overflow: hidden; cursor: zoom-in; background: #0B2260; aspect-ratio: 4 / 3; }
  .foto img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; transition: transform .8s cubic-bezier(.2,.7,.2,1); display: block; }
  .foto:hover img { transform: scale(1.06); }
  .visor { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; background: rgba(3,10,31,.94); padding: 20px; }
  .visor.on { display: grid; }
  .visor img { max-width: min(100%, 1100px); max-height: 88vh; border-radius: 1rem; box-shadow: 0 40px 100px rgba(0,0,0,.7); }
  .visor button { position: absolute; top: 18px; right: 18px; width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); color: #fff; font-size: 1.4rem; cursor: pointer; }

  /* compartir / CTA */
  .acciones { display: flex; flex-wrap: wrap; gap: .8rem 1rem; align-items: center; padding: clamp(1rem, 3vh, 1.6rem) 0 clamp(2rem, 5vh, 3rem); border-top: 1px solid var(--linea); margin-top: 1rem; }
  .acciones span { margin-right: .4rem; font-weight: 600; color: #fff; }
  .btn { display: inline-flex; align-items: center; gap: .6rem; padding: .95rem 1.5rem; border-radius: 99px; font: 700 1rem/1 var(--f-txt); text-decoration: none; background: var(--oro); color: var(--noche); border: 0; cursor: pointer; box-shadow: 0 14px 30px -12px rgba(255,205,0,.55); transition: transform .3s; }
  .btn:hover { transform: translateY(-3px); }
  .btn--l { background: none; color: #fff; box-shadow: none; border: 1.5px solid var(--linea); }
  .btn--l:hover { border-color: var(--oro); }
  .unete { margin: 0 auto clamp(2.4rem, 6vh, 4rem); padding: clamp(1.6rem, 4vw, 2.6rem); border-radius: 1.6rem; background: linear-gradient(135deg, #0B2260, #04123A); border: 1px solid var(--linea); display: flex; flex-wrap: wrap; gap: 1.2rem 2rem; align-items: center; justify-content: space-between; }
  .unete h2 { font: 400 clamp(1.7rem, 3.4vw, 2.4rem)/1.05 var(--f-tit); color: #fff; max-width: 20ch; }
  .unete p { margin-top: .4rem; font-size: 1rem; }

  /* más historias */
  .mas { background: var(--papel); color: #08163F; padding: clamp(2.4rem, 7vh, 4rem) 0; border-radius: 2rem 2rem 0 0; }
  .mas h2 { color: #08163F; }
  .mas__rej { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
  .mini { display: flex; flex-direction: column; border-radius: 1.3rem; overflow: hidden; text-decoration: none; background: #fff; border: 1px solid rgba(0,31,92,.1); box-shadow: 0 18px 36px -28px rgba(0,31,92,.5); transition: transform .4s; }
  .mini:hover { transform: translateY(-6px); }
  .mini__img { aspect-ratio: 16 / 10; background: #0B2260; overflow: hidden; }
  .mini__img img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; display: block; }
  .mini__c { padding: 1rem 1.2rem 1.3rem; display: grid; gap: .4rem; }
  .mini__c small { font: 700 .7rem/1 var(--f-txt); letter-spacing: .12em; text-transform: uppercase; color: #8a6d00; }
  .mini__c h3 { font: 400 1.5rem/1.1 var(--f-tit); color: #08163F; }
  .mas__todo { margin-top: 1.6rem; display: flex; flex-wrap: wrap; gap: .8rem; }
  .mas .btn--l { color: #08163F; border-color: rgba(0,31,92,.25); }
  .mas .btn--l:hover { border-color: #08163F; }
  footer { background: var(--papel); color: #3B4A76; border-top: 1px solid rgba(0,31,92,.12); padding: 1.4rem 0 2rem; font-size: .9rem; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: .6rem 1.6rem; justify-content: space-between; }
  .nada { padding: 30vh 0; text-align: center; }
  .nada h1 { margin: 0 auto 1rem; max-width: none; }
  @media (prefers-reduced-motion: reduce) { .hero__img img { animation: none; } html { scroll-behavior: auto; } }
  /* artículo */
  .hero--art { min-height: min(62vh, 560px); }
  .firma { margin-top: 1rem; font-weight: 600; color: var(--oro); letter-spacing: .04em; }
  .video { position: relative; aspect-ratio: 16 / 9; border-radius: 1.4rem; overflow: hidden; background: #000; box-shadow: 0 30px 70px -30px rgba(0,0,0,.85); border: 1px solid var(--linea); }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video__pie { margin: .7rem .2rem 0; font-size: .85rem; color: rgba(255,255,255,.6); }
  .art-video { padding-top: clamp(1.4rem, 4vh, 2.2rem); position: relative; z-index: 3; }
  .relato--art p:first-child::first-letter { float: none; font: inherit; color: inherit; padding: 0; }
  .relato--art p:first-child { font-size: 1.1rem; color: var(--txt); }
  /* lista de artículos */
  .lista-cab { padding: clamp(7rem, 20vh, 10rem) 0 clamp(2rem, 5vh, 3rem); }
  .lista-cab p { margin-top: 1rem; max-width: 46ch; font-size: clamp(1.05rem, 2vw, 1.25rem); color: var(--txt); }
  .lista { background: var(--papel); color: #08163F; padding: clamp(2.4rem, 7vh, 4rem) 0 clamp(3rem, 8vh, 5rem); border-radius: 2rem 2rem 0 0; min-height: 40vh; }
  .lista .mini__c p { font-size: .95rem; line-height: 1.5; color: #3B4A76; margin-top: .2rem; }
  .lista .mini__img { position: relative; }
  .lista .mini__img img { object-position: 50% 50%; }
  .lista .mini__play { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(255,205,0,.95); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .lista .mini__play::before { content: ''; position: absolute; left: 21px; top: 16px; border-style: solid; border-width: 11px 0 11px 17px; border-color: transparent transparent transparent #030A1F; }
  .lista .mas__rej { grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 380px)); justify-content: start; }
  .lista .vacio { text-align: center; padding: 3rem 0; color: #3B4A76; }
</style>
</head>
<body>
<div class="prog" id="prog"></div>

<header class="barra">
  <a class="barra__marca" href="index.html" aria-label="Club de Leones Temuco Antumalal, inicio">
    <img src="assets/img/lions-international.png" alt="" width="48" height="48"><span>Leones Temuco Antumalal</span>
  </a>
  <a class="pill" href="index.html">&larr; Volver al sitio</a>
</header>

<main id="historia"><div class="nada"><p>Cargando…</p></div></main>

<script src="assets/js/rediseno-respaldo.js"></script>
<script>
(function () {
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var main = $('#historia');
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function plano(s) { var d = document.createElement('div'); d.innerHTML = s == null ? '' : String(s); return d.textContent; }
  function slug(s) { return plano(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }
  var idDe = function (p) { return p.id || slug(p.titulo); };
  var bajar = function (u) { return fetch(u, { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); };
  function fechaLarga(f) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(f || ''); return m ? (+m[3]) + ' de ' + MESES[+m[2] - 1] + ' de ' + m[1] : ''; }

  Promise.all([bajar('data/contenido.json'), bajar('data/noticias-propias.json'), bajar('data/noticias.json')]).then(function (r) {
    var D = r[0] || window.RESPALDO || {};
    var S = (D.textos && D.textos.noticiasSec) || {};
    var lista = ((r[1] || window.RESPALDO_NOTICIAS_PROPIAS || {}).noticias || []).concat((r[2] || window.RESPALDO_NOTICIAS || {}).noticias || [])
      .filter(function (n) { return plano(n.titulo).trim() && n.enlace; });

    main.innerHTML = '';
    var cab = el('section', 'lista-cab wrap');
    var chips = el('div', 'chips'); chips.appendChild(el('span', 'chip', plano(S.eyebrow) || 'Actualidad'));
    cab.appendChild(chips);
    cab.appendChild(el('h1', null, plano(S.titulo) || 'Noticias y comunicados'));
    cab.appendChild(el('p', null, plano(S.lead) || 'Publicaciones oficiales de Lions International y prensa que cubre a los Clubes de Leones.'));
    main.appendChild(cab);

    var sec = el('section', 'lista'), w = el('div', 'wrap');
    if (!lista.length) {
      w.appendChild(el('p', 'vacio', 'Pronto publicaremos novedades.'));
    } else {
      var rej = el('div', 'mas__rej');
      lista.forEach(function (o) {
        var a2 = el('a', 'mini'); a2.href = o.enlace;
        if (/^https?:/i.test(o.enlace)) { a2.target = '_blank'; a2.rel = 'noopener'; }
        var ci = el('div', 'mini__img'), ii = document.createElement('img');
        ii.src = o.imagen || 'assets/img/noticias-respaldo.jpg'; ii.alt = ''; ii.loading = 'lazy'; ii.referrerPolicy = 'no-referrer';
        ii.onerror = function () { if (!ii.dataset.r) { ii.dataset.r = 1; ii.src = 'assets/img/noticias-respaldo.jpg'; } };
        ci.appendChild(ii); a2.appendChild(ci);
        var cc = el('div', 'mini__c');
        var meta = [plano(o.fuente), fechaLarga(o.fecha)].filter(Boolean).join(' · ');
        if (meta) cc.appendChild(el('small', null, meta));
        cc.appendChild(el('h3', null, plano(o.titulo)));
        if (plano(o.resumen)) cc.appendChild(el('p', null, plano(o.resumen).slice(0, 180)));
        a2.appendChild(cc); rej.appendChild(a2);
      });
      w.appendChild(rej);
    }
    sec.appendChild(w); main.appendChild(sec);

    var f = el('footer'), fw = el('div', 'wrap'); fw.appendChild(el('span', null, 'Club de Leones Temuco Antumalal · Distrito T-4 · Nosotros Servimos'));
    var fa = el('a', null, 'Ir al sitio principal'); fa.href = 'index.html'; fw.appendChild(fa); f.appendChild(fw); main.appendChild(f);
  });
  addEventListener('scroll', function () { var h = document.documentElement; var t = h.scrollHeight - h.clientHeight; $('#prog').style.width = (t > 0 ? (h.scrollTop / t) * 100 : 0) + '%'; }, { passive: true });
})();
</script>
</body>
</html>
